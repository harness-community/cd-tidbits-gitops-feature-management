apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-demo-dev

resources:
  - ../../base

# Replica count for dev (single replica is fine for non-prod)
replicas:
  - name: gitops-demo
    count: 1

# Image tag is updated here by the Harness CI pipeline after a successful build.
# Do not edit manually — the pipeline owns this value.
images:
  - name: docker.io/your-org/gitops-demo
    newTag: "latest"

patches:
  - path: env-patch.yaml
    target:
      kind: Deployment
      name: gitops-demo

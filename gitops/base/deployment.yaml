apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  namespace: gitops-demo
  labels:
    app: gitops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-demo
  template:
    metadata:
      labels:
        app: gitops-demo
    spec:
      containers:
        - name: gitops-demo
          # Image tag is overridden per-environment via Kustomize
          image: docker.io/your-org/gitops-demo:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # ENVIRONMENT and APP_VERSION are patched by each overlay
            - name: ENVIRONMENT
              value: base
            - name: APP_VERSION
              value: latest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

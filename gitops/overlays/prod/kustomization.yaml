apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-demo-prod

resources:
  - ../../base

# Production runs three replicas for availability.
replicas:
  - name: gitops-demo
    count: 3

# Image tag is updated here by the Harness promote step after dev validation.
# Do not edit manually — the pipeline owns this value.
# Image name must match imagePath in .harness/service.yaml and
# the repo: field in the CI BuildAndPushDockerRegistry step (w_inc_docker).
images:
  - name: gitops-example
    newTag: "latest"

patches:
  - path: env-patch.yaml
    target:
      kind: Deployment
      name: gitops-demo

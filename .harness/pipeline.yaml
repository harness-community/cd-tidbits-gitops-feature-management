pipeline:
  name: gitops-demo
  identifier: gitops_demo
  orgIdentifier: default
  projectIdentifier: w_inc
  description: |
    Builds the gitops-demo image, deploys to dev via Argo CD, awaits manual approval, then promotes the same tag to production.
  tags:
    app: gitops-demo
  properties:
    ci:
      codebase:
        repoName: gitops-example
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build and Push
        identifier: build_and_push
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: dev1
              namespace: harness-build
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  name: Build and Push to Docker Hub
                  identifier: build_push_docker
                  type: BuildAndPushDockerRegistry
                  spec:
                    repo: gitops-example
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    dockerfile: app/Dockerfile
                    context: app/
                    registryRef: w_inc_docker
                  outputVariables:
                    - name: IMAGE_TAG
                      value: <+pipeline.sequenceId>
                      type: String
    - stage:
        name: Deploy Dev
        identifier: deploy_dev
        type: Deployment
        dependsOn:
          - build_and_push
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          service:
            serviceRef: gitops_demo_service
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: primary
                      sources:
                        - identifier: primary
                          type: DockerRegistry
                          spec:
                            connectorRef: REPLACE_DOCKER_CONNECTOR
                            imagePath: your-org/gitops-demo
                            tag: <+pipeline.stages.build_and_push.spec.execution.steps.build_push_docker.output.outputVariables.IMAGE_TAG>
          environment:
            environmentRef: dev
            deployToAll: true
          execution:
            steps:
              - step:
                  name: Update Release Repo Dev
                  identifier: update_release_repo_dev
                  type: GitOpsUpdateReleaseRepo
                  timeout: 10m
                  spec:
                    variables:
                      - name: IMAGE_TAG
                        value: <+pipeline.stages.build_and_push.spec.execution.steps.build_push_docker.output.outputVariables.IMAGE_TAG>
                        type: String
              - step:
                  name: Merge PR Dev
                  identifier: merge_pr_dev
                  type: MergePR
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
              - step:
                  name: Fetch Linked Apps Dev
                  identifier: fetch_linked_apps_dev
                  type: GitOpsFetchLinkedApps
                  timeout: 10m
                  spec: {}
              - step:
                  name: Sync GitOps App Dev
                  identifier: gitops_sync_dev
                  type: GitOpsSync
                  timeout: 20m
                  spec:
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    applicationsList: []
                    retryStrategy: {}
                    retry: false
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      respectIgnoreDifferences: false
                      serverSideApply: false
                    autoPromoteRolloutBehavior: promote-full
            rollbackSteps: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: Approve Production Promotion
        identifier: approve_prod
        type: Approval
        dependsOn:
          - deploy_dev
        spec:
          execution:
            steps:
              - step:
                  name: Approve
                  identifier: approve
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |
                      Please verify the dev deployment before promoting to production.

                      Image: your-org/gitops-demo:<+pipeline.stages.build_and_push.spec.execution.steps.build_push_docker.output.outputVariables.IMAGE_TAG>
                      Dev endpoint: http://gitops-demo.gitops-demo-dev.svc.cluster.local
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - REPLACE_APPROVER_USER_GROUP
                    approverInputs: []
    - stage:
        name: Deploy Production
        identifier: deploy_prod
        type: Deployment
        dependsOn:
          - approve_prod
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          service:
            serviceRef: gitops_demo_service
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: primary
                      sources:
                        - identifier: primary
                          type: DockerRegistry
                          spec:
                            connectorRef: REPLACE_DOCKER_CONNECTOR
                            imagePath: your-org/gitops-demo
                            tag: <+pipeline.stages.build_and_push.spec.execution.steps.build_push_docker.output.outputVariables.IMAGE_TAG>
          environment:
            environmentRef: prod
            deployToAll: true
          execution:
            steps:
              - step:
                  name: Update Release Repo Production
                  identifier: update_release_repo_prod
                  type: GitOpsUpdateReleaseRepo
                  timeout: 10m
                  spec:
                    variables:
                      - name: IMAGE_TAG
                        value: <+pipeline.stages.build_and_push.spec.execution.steps.build_push_docker.output.outputVariables.IMAGE_TAG>
                        type: String
              - step:
                  name: Merge PR Production
                  identifier: merge_pr_prod
                  type: MergePR
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
              - step:
                  name: Fetch Linked Apps Production
                  identifier: fetch_linked_apps_prod
                  type: GitOpsFetchLinkedApps
                  timeout: 10m
                  spec: {}
              - step:
                  name: Sync GitOps App Production
                  identifier: gitops_sync_prod
                  type: GitOpsSync
                  timeout: 20m
                  spec:
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    applicationsList: []
                    retryStrategy: {}
                    retry: false
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      respectIgnoreDifferences: false
                      serverSideApply: false
                    autoPromoteRolloutBehavior: promote-full
            rollbackSteps: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
